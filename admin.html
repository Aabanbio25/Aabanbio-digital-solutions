<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aabanbio Admin</title><link rel="stylesheet" href="style.css"></head><body><main><section><small>ADMIN DASHBOARD</small><h2>Project Requests</h2><div id="loginBox"><form id="loginForm"><label>Email</label><input id="adminEmail" type="email" required><label>Password</label><input id="adminPassword" type="password" required><button class="btn">Login</button><p id="loginMessage" class="form-note">Admin access only.</p></form></div><div id="dashboard" hidden><div class="contact-actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn secondary" id="logout">Logout</button></div><div id="requests" style="margin-top:20px"></div><section style="margin-top:30px"><h2>Payment History</h2><div id="paymentStats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:15px 0"></div><div id="payments"></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://gmfvsmbmcgkhzhdxbjjt.supabase.co','sb_publishable_4A-0ZYzAJs98PV3jdbgopA_MvoJdsgt');const loginBox=document.getElementById('loginBox'),dash=document.getElementById('dashboard'),msg=document.getElementById('loginMessage'),list=document.getElementById('requests'),payments=document.getElementById('payments'),paymentStats=document.getElementById('paymentStats');async function load(){const{data,error}=await sb.from('project_requests').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<p>Unable to load requests. Admin authorization may not be configured yet.</p>';return}list.innerHTML=data.length?data.map(r=>{const phone=String(r.phone||'').replace(/\\D/g,'');const wa=phone.startsWith('0')?'233'+phone.slice(1):phone;return '<article><small>'+new Date(r.created_at).toLocaleString()+'</small><h3>'+esc(r.name)+' — '+esc(r.service)+'</h3><p>📞 '+esc(r.phone)+' · 📧 '+esc(r.email)+'<br>Budget: '+esc(r.budget||'Not specified')+'</p><p>'+esc(r.details)+'</p><label>Reply to customer</label><textarea id="reply-'+r.id+'" rows="4" placeholder="Write your response here...">'+esc(r.admin_reply||'')+'</textarea><div class="contact-actions" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn save-reply" data-id="'+r.id+'">Save Reply</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent(r.admin_reply||'')+'">WhatsApp</a><a class="btn secondary" href="mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent('Re: Your Aabanbio Digital Solutions request')+'&body='+encodeURIComponent(r.admin_reply||'')+'">Email</a></div><select data-id="'+r.id+'" class="status" style="margin-top:12px"><option '+(r.status==='new'?'selected':'')+'>new</option><option '+(r.status==='contacted'?'selected':'')+'>contacted</option><option '+(r.status==='in_progress'?'selected':'')+'>in_progress</option><option '+(r.status==='completed'?'selected':'')+'>completed</option><option '+(r.status==='cancelled'?'selected':'')+'>cancelled</option></select></article>'}).join(''):'<p>No project requests yet.</p>';document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{const{error}=await sb.from('project_requests').update({status:s.value}).eq('id',s.dataset.id);if(error)alert(error.message)});document.querySelectorAll('.save-reply').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const reply=document.getElementById('reply-'+id).value.trim();const{error}=await sb.from('project_requests').update({admin_reply:reply,replied_at:reply?new Date().toISOString():null,status:reply?'contacted':'new'}).eq('id',id);if(error)alert(error.message);else{b.textContent='Saved ✓';setTimeout(()=>b.textContent='Save Reply',1500)}});await loadPayments()}async function loadPayments(){const{data,error}=await sb.from('payments').select('id,created_at,request_id,reference,amount,currency,status,paid_at,project_requests(name,email,phone,service)').order('created_at',{ascending:false});if(error){payments.innerHTML='<p>Unable to load payments.</p>';return}const rows=data||[];const success=rows.filter(p=>p.status==='success');const pending=rows.filter(p=>p.status==='pending');const total=success.reduce((sum,p)=>sum+(Number(p.amount)||0),0);paymentStats.innerHTML='<div style="padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:10px"><small>Successful</small><h3>'+success.length+'</h3></div><div style="padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:10px"><small>Pending</small><h3>'+pending.length+'</h3></div><div style="padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:10px"><small>Total received</small><h3>GHS '+(total/100).toFixed(2)+'</h3></div>';payments.innerHTML=rows.length?'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px">Customer</th><th style="text-align:left;padding:10px">Service</th><th style="text-align:left;padding:10px">Amount</th><th style="text-align:left;padding:10px">Status</th><th style="text-align:left;padding:10px">Reference</th><th style="text-align:left;padding:10px">Date</th></tr></thead><tbody>'+rows.map(p=>{const q=p.project_requests||{};return '<tr><td style="padding:10px">'+esc(q.name||'—')+'<br><small>'+esc(q.phone||'')+'</small></td><td style="padding:10px">'+esc(q.service||'—')+'</td><td style="padding:10px">'+esc(p.currency)+' '+(Number(p.amount)/100).toFixed(2)+'</td><td style="padding:10px">'+esc(p.status)+'</td><td style="padding:10px;font-size:12px">'+esc(p.reference)+'</td><td style="padding:10px">'+new Date(p.created_at).toLocaleString()+'</td></tr>'}).join('')+'</tbody></table></div>':'<p>No payments yet.</p>'}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(error){msg.textContent=error.message;return}loginBox.hidden=true;dash.hidden=false;load()};document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
</script></body></html>
