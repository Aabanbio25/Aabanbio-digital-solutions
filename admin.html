<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aabanbio Admin</title><link rel="stylesheet" href="style.css"></head><body><main><section><small>ADMIN DASHBOARD</small><h2>Project Requests</h2><div id="loginBox"><form id="loginForm"><label>Email</label><input id="adminEmail" type="email" required><label>Password</label><input id="adminPassword" type="password" required><button class="btn">Login</button><p id="loginMessage" class="form-note">Admin access only.</p></form></div><div id="dashboard" hidden><div class="contact-actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn secondary" id="logout">Logout</button></div><div id="requests" style="margin-top:20px"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://gmfvsmbmcgkhzhdxbjjt.supabase.co','sb_publishable_4A-0ZYzAJs98PV3jdbgopA_MvoJdsgt');const loginBox=document.getElementById('loginBox'),dash=document.getElementById('dashboard'),msg=document.getElementById('loginMessage'),list=document.getElementById('requests');async function load(){const{data,error}=await sb.from('project_requests').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<p>Unable to load requests. Admin authorization may not be configured yet.</p>';return}list.innerHTML=data.length?data.map(r=>'<article><small>'+new Date(r.created_at).toLocaleString()+'</small><h3>'+esc(r.name)+' — '+esc(r.service)+'</h3><p>📞 '+esc(r.phone)+' · 📧 '+esc(r.email)+'<br>Budget: '+esc(r.budget||'Not specified')+'</p><p>'+esc(r.details)+'</p><select data-id="'+r.id+'" class="status"><option '+(r.status==='new'?'selected':'')+'>new</option><option '+(r.status==='contacted'?'selected':'')+'>contacted</option><option '+(r.status==='in_progress'?'selected':'')+'>in_progress</option><option '+(r.status==='completed'?'selected':'')+'>completed</option><option '+(r.status==='cancelled'?'selected':'')+'>cancelled</option></select></article>').join(''):'<p>No project requests yet.</p>';document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{await sb.from('project_requests').update({status:s.value}).eq('id',s.dataset.id)})}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(error){msg.textContent=error.message;return}loginBox.hidden=true;dash.hidden=false;load()};document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
</script></body></html>
